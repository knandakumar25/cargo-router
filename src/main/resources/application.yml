server:
  port: 28500

spring:
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cargo-router-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.logistics.cargorouter.foundation.CargoShipment
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:h2:mem:cargorouterdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

general:
  kafka-inbound-topic: cargo-updates
  kafka-outbound-topic: reroute-commands
  weather-api-url: https://api.open-meteo.com/v1/forecast
  agent-interval-ms: 60000
  risk-threshold: 0.65
  min-improvement-threshold: 0.10
