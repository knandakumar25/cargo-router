server:
  port: 28500

general:
  # ── Kafka topics ──────────────────────────────────────────────────────────
  # Mirrors JPMC's general.kafka-topic pattern; split into inbound/outbound.
  kafka-inbound-topic:  cargo-updates     # consumed by ShipmentListener
  kafka-outbound-topic: reroute-commands  # produced by RerouteDecider

  # ── Weather API ───────────────────────────────────────────────────────────
  # Open-Meteo: free, no API key required.
  # Swap to https://api.openweathermap.org/data/2.5/weather?appid=KEY for OWM.
  weather-api-url: https://api.open-meteo.com/v1/forecast

  # ── Agentic loop ──────────────────────────────────────────────────────────
  agent-interval-ms: 60000   # How often the loop runs (milliseconds)

  # Risk score [0.0–1.0] above which a shipment triggers alternative search
  risk-threshold: 0.65

  # Minimum improvement in risk score before a reroute is committed.
  # Prevents churn when the alternative is only marginally better.
  min-improvement-threshold: 0.10

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cargo-router-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:h2:mem:cargorouterdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
